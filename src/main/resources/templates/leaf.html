<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Spring Boot Thymeleaf</title>
    </head>
    <body>
        <h1 th:text="${name}">장재용</h1>
        <h1>Hello, <span th:text="${name}"></span></h1>
        <h1>Hello, [[${name}]]</h1>  <!-- th는 html태그안에 넣어줘야한다 [[를 쓰면 태그안에 안넣어도 됨. -->
    </body>
</html>
